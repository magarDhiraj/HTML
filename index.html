<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="logo.png" alt="Logo">

        <nav>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Website</a>
        </nav>
    </header>

    <main>
        <section class="profile">

            <h1>John Smith</h1>

            <img class="student-photo" src="student.jpg" alt="Student Photo">

            <h2>About Me</h2>

            <p>
                Hello! My name is John Smith. I am a computer science
                student and I am learning HTML, CSS and JavaScript.
            </p>

            <h2>My Skills</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>C#</li>
            </ul>

            <h2>My Website</h2>

            <a class="website-link" href="#">
                Visit My Website
            </a>

        </section>
    </main>

</body>
</html>
